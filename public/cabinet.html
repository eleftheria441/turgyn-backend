<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turgyn — кабинет</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/assets/cabinet.css?v=6">
</head>
<body>

<!-- ============ LANDING ============ -->
<div id="login">
  <div class="login-card">
    <div class="logo"><span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#3fe6c0" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 10.5 12 4.5l7.5 6"/><path d="M8.2 11.5v3.6a3.8 3.8 0 0 0 7.6 0v-3.6"/></svg></span><span><b>tur</b><span>gyn</span></span></div>
    <p class="sub" id="lg-sub">Вход для сотрудников</p>
    <div style="display:flex;justify-content:center;gap:8px;margin-bottom:14px">
      <button type="button" class="btn gho sm" onclick="setAdminLang('kz')">ҚАЗ</button>
      <button type="button" class="btn gho sm" onclick="setAdminLang('ru')">РУС</button>
    </div>
    <label>Логин</label>
    <input id="lg-login" autocomplete="username">
    <label>Пароль</label>
    <input id="lg-pass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn" id="btn-login" onclick="doLogin()">Войти в систему</button>
    <a href="/" class="login-back">← На сайт Turgyn</a>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <aside class="side">
    <div class="brand"><div class="logo"><span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#3fe6c0" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 10.5 12 4.5l7.5 6"/><path d="M8.2 11.5v3.6a3.8 3.8 0 0 0 7.6 0v-3.6"/></svg></span><span><b>tur</b><span>gyn</span></span></div></div>
    <nav id="nav"></nav>
    <div class="foot">v1.0 · Рабочая среда УК<br><span id="foot-org"></span></div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div><h1 id="pg-title">Дашборд</h1><div class="path" id="pg-path"></div></div>
      <div class="spacer"></div>
      <div class="osi-select" id="osi-picker-wrap">
        <label>ОСИ:</label>
        <select id="osi-picker" onchange="setActiveOsi(this.value)"></select>
      </div>
      <span id="conn-badge" style="margin-right:8px"></span>
      <button class="btn gho sm" id="lang-toggle" onclick="toggleAdminLang()" title="Тіл / Язык" style="margin-right:4px">ҚАЗ</button>
      <div class="userchip">
        <div class="who"><b id="u-name"></b><span id="u-role"></span></div>
        <div class="av" id="u-av">A</div>
        <button class="btn gho sm" onclick="pwdForm(false)" title="Сменить пароль">Пароль</button>
        <button class="btn gho sm" id="btn-logout" onclick="logout()" title="Выход">Выход</button>
      </div>
    </div>
    <div class="content" id="view"></div>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast"></div>
<div id="cal-pop" class="hidden"></div>

<script src="/assets/cabinet.js?v=6"></script>
</body>
</html>
